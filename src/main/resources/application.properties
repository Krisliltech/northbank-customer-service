spring.application.name=Customer-Service
spring.datasource.url=${DATABASE_URL}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
jwt.secret = ${JWT_SECRET}
jwt.expiration= ${JWT_EXPIRATION:3600000}
springdoc.api-docs.enabled=${API_ENABLED}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
outbox.relay.enabled=true
outbox.relay.batch-size=50
outbox.relay.poll-interval-ms=1000
outbox.relay.send-timeout-seconds=12
outbox.relay.backoff-initial-ms=1000
outbox.relay.backoff-max-ms=30000
outbox.maintenance.enabled=true
outbox.maintenance.retention-days=7
outbox.maintenance.purge-batch-size=500
outbox.maintenance.stuck-after-minutes=5
outbox.maintenance.report-interval-ms=60000
spring.task.scheduling.pool.size=3
logging.level.org.springframework.kafka.support.LoggingProducerListener=OFF
spring.kafka.producer.properties.reconnect.backoff.ms=500
spring.kafka.producer.properties.reconnect.backoff.max.ms=3000
logging.level.org.apache.kafka.clients.Metadata=WARN
logging.level.org.apache.kafka.clients.NetworkClient=WARN
logging.level.org.apache.kafka.clients.admin.internals.AdminMetadataManager=WARN
spring.kafka.security.protocol=SASL_PLAINTEXT
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";